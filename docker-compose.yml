version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aiscribe-postgres
    environment:
      POSTGRES_DB: aiscribe
      POSTGRES_USER: aiscribe
      POSTGRES_PASSWORD: aiscribe_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiscribe"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiscribe-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://aiscribe:aiscribe_dev_password@postgres:5432/aiscribe
      SECRET_KEY: dev-secret-key-change-in-production-min-32-chars
      CORS_ORIGINS: '["http://localhost:3000", "http://frontend:3000"]'
      STORAGE_BACKEND: local
      STORAGE_PATH: /var/aiscribe/audio
      WHISPER_MODEL: medium
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      AU_DATA_RESIDENCY: "true"
    volumes:
      - ./backend:/app
      - audio_storage:/var/aiscribe/audio
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiscribe-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  audio_storage:
